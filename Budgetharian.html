<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajer Pengeluaran Harian</title>
    <!-- Menggunakan font Inter dari Google Fonts untuk tampilan elegan -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.25rem;
            text-align: center;
            margin: 0 0 24px 0;
            font-weight: 600;
        }

        /* Tampilan Kartu Budget */
        .budget-card {
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            color: white;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 8px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .budget-card p {
            margin: 0;
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .budget-card h2 {
            margin: 8px 0 0;
            font-size: 2.25rem;
            font-weight: 700;
        }

        /* Form Input */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .input-group.column {
            flex-direction: column;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .btn-full {
            width: 100%;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 24px 0;
        }

        /* Riwayat Pengeluaran */
        .history h3 {
            font-size: 1rem;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .expense-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 220px;
            overflow-y: auto;
        }

        /* Scrollbar untuk riwayat */
        .expense-list::-webkit-scrollbar {
            width: 6px;
        }
        .expense-list::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid var(--danger);
            animation: fadeIn 0.3s ease;
        }

        .expense-item .desc {
            font-weight: 500;
            color: var(--text-main);
        }

        .expense-item .amount {
            font-weight: 600;
            color: var(--danger);
            font-size: 0.95rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Catatan Keuangan</h1>
        
        <!-- Area Display Budget -->
        <div class="budget-card">
            <p>Total Sisa Budget</p>
            <h2 id="displayBudget">Rp 0</h2>
        </div>

        <!-- Form Set Budget -->
        <div class="input-group">
            <input type="number" id="budgetInput" placeholder="Set saldo awal (Rp)" min="0">
            <button onclick="setBudget()">Set Saldo</button>
        </div>

        <div class="divider"></div>

        <!-- Form Tambah Pengeluaran -->
        <div class="input-group column">
            <input type="text" id="expenseName" placeholder="Untuk apa pengeluaran ini? (Misal: Makan Siang)">
            <input type="number" id="expenseAmount" placeholder="Jumlah pengeluaran (Rp)" min="0">
            <button class="btn-full" onclick="addExpense()">Catat Pengeluaran</button>
        </div>

        <!-- Riwayat -->
        <div class="history">
            <h3>Riwayat Hari Ini</h3>
            <ul class="expense-list" id="expenseList">
                <!-- Data akan muncul di sini -->
            </ul>
        </div>
    </div>

    <!-- Script Logika -->
    <script>
        let currentBudget = 0;

        // Fungsi untuk format angka ke Rupiah
        const formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(angka);
        };

        // Memperbarui tampilan angka pada kartu biru
        const updateUI = () => {
            document.getElementById('displayBudget').innerText = formatRupiah(currentBudget);
        };

        // Fungsi mengatur/menambah budget awal
        const setBudget = () => {
            const budgetInput = document.getElementById('budgetInput').value;
            if (budgetInput && parseFloat(budgetInput) > 0) {
                currentBudget = parseFloat(budgetInput);
                updateUI();
                document.getElementById('budgetInput').value = ''; // Kosongkan input
            } else {
                alert('Silakan masukkan nominal saldo yang valid.');
            }
        };

        // Fungsi menambah pengeluaran dan memotong budget
        const addExpense = () => {
            const name = document.getElementById('expenseName').value;
            const amount = document.getElementById('expenseAmount').value;

            if (name === '' || amount === '' || parseFloat(amount) <= 0) {
                alert('Mohon isi nama dan jumlah pengeluaran dengan benar.');
                return;
            }

            // Kurangi budget
            currentBudget -= parseFloat(amount);
            updateUI();

            // Tambahkan ke daftar riwayat HTML
            const list = document.getElementById('expenseList');
            const li = document.createElement('li');
            li.className = 'expense-item';
            li.innerHTML = `
                <span class="desc">${name}</span> 
                <span class="amount">-${formatRupiah(amount)}</span>
            `;
            
            // Masukkan elemen baru di urutan paling atas
            list.prepend(li); 

            // Bersihkan kolom input form
            document.getElementById('expenseName').value = '';
            document.getElementById('expenseAmount').value = '';
        };

        // Inisialisasi tampilan awal
        updateUI();
    </script>
</body>
</html>
