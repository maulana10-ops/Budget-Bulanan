<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajer Keuangan Simple</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 480px; 
            padding: 28px 24px; 
            border-radius: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            height: fit-content;
        }

        h2.title { 
            margin: 0 0 24px 0; 
            font-size: 1.35rem; 
            text-align: center; 
            font-weight: 700;
        }
        
        /* Filter Bulan */
        .month-selector-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .month-selector-box label { font-weight: 600; font-size: 0.95rem; }
        .month-selector-box input {
            border: none; background: transparent; font-family: inherit; font-weight: 600;
            color: var(--primary); font-size: 0.95rem; outline: none; padding: 0; margin: 0;
            cursor: pointer;
        }

        /* Kartu Budget */
        .budget-card { 
            background: var(--primary); 
            color: white; 
            padding: 24px; 
            border-radius: 16px; 
            text-align: center; 
            margin-bottom: 24px;
            position: relative; /* Penting untuk mengatur posisi tombol edit di pojok */
        }
        
        .budget-card p { margin: 0; font-size: 0.85rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.9; }
        .budget-amount-wrapper { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 8px; }
        .budget-card h2 { font-size: 2.2rem; margin: 0; font-weight: 700; word-break: break-word; }
        
        /* Modifikasi Posisi Tombol Edit ke Pojok Kanan Atas */
        .edit-budget-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.2);
            border: none; color: white; border-radius: 8px;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; padding: 0;
        }
        .edit-budget-btn:hover { background: rgba(255, 255, 255, 0.3); }
        .edit-budget-btn svg { width: 16px; height: 16px; fill: currentColor; }
        
        /* Form & Inputs */
        .section-title { font-size: 1rem; margin: 0 0 16px 0; font-weight: 600; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        
        input { 
            width: 100%; padding: 14px 16px; border: 1px solid var(--border); 
            border-radius: 12px; box-sizing: border-box; font-family: inherit; font-size: 0.95rem;
            color: var(--text-main); transition: 0.2s; background: #fff;
        }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); }
        input::placeholder { color: #9ca3af; }
        
        /* Tata Letak Tanggal */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        
        button { 
            width: 100%; cursor: pointer; padding: 14px; border-radius: 12px; 
            font-family: inherit; font-weight: 600; font-size: 0.95rem; border: none;
            display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        
        .hidden { display: none !important; }
        hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }

        /* Riwayat Pengeluaran */
        .expense-list { list-style: none; padding: 0; margin: 0; max-height: 350px; overflow-y: auto; }
        .expense-list::-webkit-scrollbar { width: 4px; }
        .expense-list::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }

        .expense-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 16px 0; border-bottom: 1px solid var(--border);
        }
        .expense-item:last-child { border-bottom: none; }
        
        .expense-info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; padding-right: 12px; }
        .expense-name { font-weight: 600; color: var(--text-main); font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .expense-amount { font-weight: 700; color: var(--danger); font-size: 0.95rem; }
        .expense-period { font-size: 0.75rem; color: var(--text-muted); }
        
        .actions { display: flex; gap: 8px; flex-shrink: 0; }
        .icon-btn { 
            width: 32px; height: 32px; border-radius: 8px; padding: 0; 
            display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: #64748b;
        }
        .icon-btn:hover { background: #e2e8f0; color: var(--text-main); }
        .icon-btn.del:hover { background: #fee2e2; color: var(--danger); }
        .icon-btn svg { width: 16px; height: 16px; stroke-width: 2; }

        .export-btn { background: #f8fafc; color: var(--text-main); border: 1px solid var(--border); margin-top: 24px; }
        .export-btn:hover { background: #f1f5f9; }
        
        .empty-state { text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 24px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="title">Keuangan Pribadi</h2>

    <!-- Pemilih Bulan -->
    <div class="month-selector-box">
        <label>Periode Bulan</label>
        <input type="month" id="monthSelector" onchange="changeMonth()">
    </div>
    
    <!-- Kartu Budget -->
    <div class="budget-card">
        <!-- Tombol Edit Sekarang di Sini (Pojok Kanan Atas) -->
        <button onclick="editTotalBudget()" class="edit-budget-btn hidden" id="editBudgetBtn" title="Edit Budget">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
        
        <p>Sisa Budget Bulan Ini</p>
        <div class="budget-amount-wrapper">
            <h2 id="displayBudget">Rp 0</h2>
        </div>
    </div>

    <!-- Set Budget -->
    <div id="budgetSetupSection">
        <div class="form-group">
            <input type="text" id="budgetInput" placeholder="Masukkan total budget (Rp)" onkeyup="formatInput(this)">
        </div>
        <button class="btn-primary" onclick="setBudget()">Simpan Budget</button>
        <hr>
    </div>

    <!-- Form Pengeluaran -->
    <h3 class="section-title">Catat Pengeluaran</h3>
    
    <div class="form-group">
        <input type="text" id="expenseName" placeholder="Untuk keperluan apa?">
    </div>
    <div class="form-group">
        <input type="text" id="expenseAmount" placeholder="Nominal pengeluaran (Rp)" onkeyup="formatInput(this)">
    </div>
    
    <div class="grid-2">
        <div>
            <label>Tanggal Mulai</label>
            <input type="date" id="expStartDate">
        </div>
        <div>
            <label>Tanggal Akhir</label>
            <input type="date" id="expEndDate">
        </div>
    </div>

    <button class="btn-primary" onclick="addExpense()">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        Tambah Pengeluaran
    </button>

    <hr>

    <!-- Riwayat -->
    <h3 class="section-title">Riwayat Bulan Ini</h3>
    <ul id="expenseList" class="expense-list"></ul>
    
    <button class="export-btn" onclick="exportToExcel()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        Simpan ke Excel (.csv)
    </button>
</div>

<script>
    let appData = JSON.parse(localStorage.getItem('monthlyBudgetData')) || {};
    let currentMonth = "";
    
    let activeInitialBudget = 0;
    let activeCurrentBudget = 0;
    let activeExpenses = [];

    window.onload = function() {
        let savedMonth = localStorage.getItem('lastOpenedMonth');
        if (!savedMonth) {
            let d = new Date();
            let m = (d.getMonth() + 1).toString().padStart(2, '0');
            savedMonth = `${d.getFullYear()}-${m}`;
        }
        
        currentMonth = savedMonth;
        document.getElementById('monthSelector').value = currentMonth;
        loadMonthData(currentMonth);
    };

    function changeMonth() {
        currentMonth = document.getElementById('monthSelector').value;
        localStorage.setItem('lastOpenedMonth', currentMonth);
        loadMonthData(currentMonth);
    }

    function loadMonthData(monthStr) {
        if (!appData[monthStr]) {
            appData[monthStr] = { initialBudget: 0, currentBudget: 0, expenses: [] };
        }
        activeInitialBudget = appData[monthStr].initialBudget;
        activeCurrentBudget = appData[monthStr].currentBudget;
        activeExpenses = appData[monthStr].expenses;
        
        updateUI();
        renderList();
    }

    function saveData() {
        appData[currentMonth] = {
            initialBudget: activeInitialBudget,
            currentBudget: activeCurrentBudget,
            expenses: activeExpenses
        };
        localStorage.setItem('monthlyBudgetData', JSON.stringify(appData));
    }

    function formatInput(el) {
        let val = el.value.replace(/[^0-9]/g, '');
        el.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseNum(val) { return parseInt(val.toString().replace(/\./g, '')) || 0; }
    function toRupiah(val) { return "Rp " + val.toLocaleString('id-ID'); }

    function formatDateID(dateStr) {
        if(!dateStr) return "";
        let parts = dateStr.split('-');
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function getPeriodText(start, end) {
        let s = formatDateID(start);
        let e = formatDateID(end);
        if (s && e) return `${s} - ${e}`;
        if (s) return `${s}`;
        if (e) return `s/d ${e}`;
        return "-";
    }

    function updateUI() { 
        document.getElementById('displayBudget').innerText = toRupiah(activeCurrentBudget); 
        
        const setupSection = document.getElementById('budgetSetupSection');
        const editBtn = document.getElementById('editBudgetBtn');

        if (activeInitialBudget > 0) {
            setupSection.classList.add('hidden');
            editBtn.classList.remove('hidden');   
        } else {
            setupSection.classList.remove('hidden'); 
            editBtn.classList.add('hidden');         
        }
    }

    function setBudget() {
        let inputVal = parseNum(document.getElementById('budgetInput').value);
        if(inputVal <= 0) return alert("Mohon masukkan nominal yang valid.");
        
        activeInitialBudget = inputVal;
        activeCurrentBudget = activeInitialBudget - activeExpenses.reduce((sum, e) => sum + e.amount, 0);

        saveData();
        updateUI();
        document.getElementById('budgetInput').value = '';
    }

    function editTotalBudget() {
        let userInput = prompt(`Ubah Total Budget Awal (Saat ini: ${toRupiah(activeInitialBudget)})\n\nMasukkan angka baru (tanpa titik/koma):`, activeInitialBudget);
        
        if (userInput === null || userInput.trim() === "") return;

        let newVal = parseNum(userInput);
        if (newVal >= 0) {
            activeInitialBudget = newVal;
            let totalPengeluaran = activeExpenses.reduce((sum, e) => sum + e.amount, 0);
            activeCurrentBudget = activeInitialBudget - totalPengeluaran;
            
            saveData();
            updateUI();
        } else {
            alert("Nominal tidak valid.");
        }
    }

    function addExpense() {
        let name = document.getElementById('expenseName').value;
        let amount = parseNum(document.getElementById('expenseAmount').value);
        let start = document.getElementById('expStartDate').value;
        let end = document.getElementById('expEndDate').value;

        if(!name || amount <= 0) return alert("Mohon lengkapi kolom nama dan nominal pengeluaran!");
        if(activeInitialBudget <= 0) return alert("Silakan isi budget awal terlebih dahulu.");
        
        activeExpenses.push({ 
            id: Date.now(), 
            name: name, 
            amount: amount,
            startDate: start,
            endDate: end
        });
        
        activeCurrentBudget -= amount;
        saveData();
        updateUI();
        renderList();

        document.getElementById('expenseName').value = '';
        document.getElementById('expenseAmount').value = '';
        document.getElementById('expStartDate').value = '';
        document.getElementById('expEndDate').value = '';
    }

    function deleteExpense(id) {
        if(confirm("Yakin ingin menghapus data ini?")) {
            let item = activeExpenses.find(e => e.id === id);
            activeCurrentBudget += item.amount; 
            activeExpenses = activeExpenses.filter(e => e.id !== id);
            saveData();
            updateUI();
            renderList();
        }
    }

    function editExpense(id) {
        let item = activeExpenses.find(e => e.id === id);
        
        let newName = prompt("Ubah nama pengeluaran:", item.name);
        if(newName === null || newName.trim() === "") return;
        
        let newAmount = parseNum(prompt("Ubah nominal (hanya angka):", item.amount));
        if(newAmount <= 0) return alert("Nominal tidak valid!");

        let newStart = prompt("Ubah tanggal mulai (Contoh: 2026-08-01):", item.startDate || "");
        let newEnd = prompt("Ubah tanggal akhir (Contoh: 2026-08-02):", item.endDate || "");
        
        activeCurrentBudget += (item.amount - newAmount); 
        item.name = newName;
        item.amount = newAmount;
        item.startDate = newStart;
        item.endDate = newEnd;
        
        saveData();
        updateUI();
        renderList();
    }

    function renderList() {
        let list = document.getElementById('expenseList');
        list.innerHTML = "";
        
        if(activeExpenses.length === 0) {
            list.innerHTML = `<li class="empty-state">Belum ada pengeluaran dicatat bulan ini.</li>`;
            return;
        }

        [...activeExpenses].reverse().forEach(e => {
            let periodText = getPeriodText(e.startDate, e.endDate);
            let periodHtml = periodText !== "-" ? `<span class="expense-period">${periodText}</span>` : '';
            
            list.innerHTML += `
                <li class="expense-item">
                    <div class="expense-info">
                        <span class="expense-name" title="${e.name}">${e.name}</span>
                        <span class="expense-amount">-${toRupiah(e.amount)}</span>
                        ${periodHtml}
                    </div>
                    <div class="actions">
                        <button class="icon-btn" onclick="editExpense(${e.id})" title="Edit">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        </button>
                        <button class="icon-btn del" onclick="deleteExpense(${e.id})" title="Hapus">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                </li>`;
        });
    }

    function exportToExcel() {
        if(activeExpenses.length === 0) return alert("Belum ada data untuk disimpan!");

        let csv = `Laporan Keuangan Periode: ${currentMonth}\n\n`;
        csv += `Total Budget Awal;,${activeInitialBudget}\n`;
        csv += `Sisa Saldo;,${activeCurrentBudget}\n\n`;
        csv += "Deskripsi;Nominal;Tgl Mulai;Tgl Akhir\n";
        
        activeExpenses.forEach(e => {
            csv += `${e.name};${e.amount};${formatDateID(e.startDate)};${formatDateID(e.endDate)}\n`;
        });
        
        let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url; 
        a.download = `Keuangan_${currentMonth}.csv`; 
        a.click();
    }
</script>

</body>
</html>
